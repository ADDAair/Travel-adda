name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/raw
          curl -sSL -A "Mozilla/5.0" -o /tmp/raw/quran-simple.txt "https://tanzil.net/pub/download/index.php?marks=true&sajdah=true&rub=false&tatweel=false&quranType=simple&outType=txt-2&agree=true"
          curl -sSL -A "Mozilla/5.0" -o /tmp/raw/en-translit.txt "https://tanzil.net/trans/?transID=en.transliteration&type=txt-2"
          wc -l /tmp/raw/*; head -c 300 /tmp/raw/quran-simple.txt
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-raw && git rm -rfq . && cp /tmp/raw/* . && git add . && git commit -qm raw && git push -f -q origin ci-raw
