name: otp-test
on: [push, workflow_dispatch]
permissions: { contents: read }
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: type check and tests of the SMS code server function
        run: |
          set -o pipefail
          # run outside the app folder, so Deno does not try to use the app's node_modules
          mkdir -p /tmp/fn && cp supabase/functions/phone-otp/*.ts /tmp/fn/ && cd /tmp/fn
          deno check index.ts 2>&1 | tee /tmp/check.log || { echo "::error title=deno check::$(tail -c 1500 /tmp/check.log | tr '\n' ' ')"; exit 1; }
          deno test 2>&1 | tee /tmp/test.log || { echo "::error title=deno test::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -A12 'AssertionError' | head -40 | tail -c 1800 | tr '\n' ' ')"; exit 1; }
