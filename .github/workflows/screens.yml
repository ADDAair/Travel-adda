name: screens
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: build web preview (test only, not shipped)
        run: |
          npm install --legacy-peer-deps
          npx expo install react-dom react-native-web @expo/metro-runtime -- --legacy-peer-deps
          npx expo export --platform web --output-dir web-dist
      - name: take screenshots
        env: { CI_TEST_SECRET: '${{ secrets.CI_TEST_SECRET }}' }
        run: |
          # Dedicated test account with no special rights (RLS limits it to its own row).
          . tests/ci_pw.sh
          node tests/ci_rotate.mjs || true
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          (cd web-dist && python -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          python tests/screens.py
      - name: publish screenshots to ci-screens branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots /tmp/out/ 2>/dev/null || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-screens
          git rm -rfq . && cp -r /tmp/out/shots . 2>/dev/null || mkdir shots
          git add shots && git commit -qm "screens ${GITHUB_SHA}" && git push -f origin ci-screens
