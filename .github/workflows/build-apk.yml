name: build-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Firebase file for push (from secret; skipped if not set)
        env: { GSJ: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > google-services.json; node -e "const j=require('./google-services.json'); if(!j.client.some(c=>c.client_info.android_client_info.package_name==='app.amihaji.hajumrah')) { console.log('::warning title=PUSH OFF::google-services.json is for another package (app renamed to app.amihaji.hajumrah) - add the new package in Firebase and update the secret. This APK is built without push.'); require('fs').unlinkSync('./google-services.json'); process.exit(0) } console.log('push: Firebase file ready')"; else echo "::warning::GOOGLE_SERVICES_JSON not set: APK built without push"; fi
      - name: build
        run: |
          set +e
          run() { echo "### $*"; "$@" > step.log 2>&1; code=$?; tail -n 200 step.log; if [ $code -ne 0 ]; then tail -n 60 step.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | { read -r m; echo "::error title=FAILED: $*::$m"; }; fi; return $code; }
          run npm install --legacy-peer-deps || exit 1
          run npx expo prebuild --platform android --no-install || exit 1
          cd android
          run ./gradlew assembleRelease --no-daemon || exit 1
          ls -la app/build/outputs/apk/release/
      # Security step 1 (Nov 2026): Expo signs with the public "Android Debug" key, which anyone has. The APK is re-signed
      # with Travel Adda's own test key, re-made from a GitHub secret (tools/test_signing_key.mjs); the key never leaves
      # this job and is deleted right after use. No secret = no APK (never silently debug-signed).
      - name: sign with Travel Adda's own test key
        env: { TA_SIGN_SEED_SRC: '${{ secrets.CI_TEST_SECRET }}' }
        run: |
          set -eo pipefail
          if [ -z "$TA_SIGN_SEED_SRC" ]; then echo "::error title=NO SIGNING SECRET::no signing secret (CI_TEST_SECRET) - no APK is made, so it is never signed with the public debug key"; exit 1; fi
          K="$RUNNER_TEMP/ta-sign"; trap 'rm -rf "$K"' EXIT
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          node tools/test_signing_key.mjs "$K"
          f=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" sign --key "$K/key.pk8" --cert "$K/cert.der" --out "$f.signed" "$f"
          rm -f "$K/key.pk8"; mv "$f.signed" "$f"; rm -f "$f.signed.idsig"
          "$BT/apksigner" verify --print-certs "$f" | tee certs.txt
          if grep -q "Android Debug" certs.txt; then echo "::error title=DEBUG KEY::the APK is still signed with the public debug key"; exit 1; fi
          grep -q "CN=Ami Haji Test" certs.txt || { echo "::error title=SIGNING::the APK does not carry the Travel Adda test key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: travel-adda-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      - name: publish to Releases (direct download)
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          f=$(ls android/app/build/outputs/apk/release/*.apk | head -1); cp "$f" travel-adda-test.apk
          gh release delete test-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create test-latest travel-adda-test.apk --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "পরীক্ষামূলক APK (সর্বশেষ)" --notes "শুধু পরীক্ষার জন্য। commit ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
          # gh sometimes leaves the release as a draft (then the download link gives 404): publish it and check the link
          for i in 1 2 3 4 5; do
            [ "$(gh release view test-latest --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false" ] && break
            gh release edit test-latest --repo "$GITHUB_REPOSITORY" --draft=false || true; sleep 5
          done
          # the repository is private, so the link only works for a signed-in GitHub account: check through the API
          ok=$(gh release view test-latest --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '(.isDraft|not) and ([.assets[].name] | index("travel-adda-test.apk") != null)')
          [ "$ok" = "true" ] || { echo "::error title=DOWNLOAD LINK BROKEN::release is a draft or the APK is missing"; exit 1; }
