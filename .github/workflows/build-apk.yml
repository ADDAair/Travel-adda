name: build-apk
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: build
        run: |
          set +e
          run() { echo "### $*"; "$@" > step.log 2>&1; code=$?; tail -n 200 step.log; if [ $code -ne 0 ]; then tail -n 60 step.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | { read -r m; echo "::error title=FAILED: $*::$m"; }; fi; return $code; }
          run npm install --legacy-peer-deps || exit 1
          run npx expo prebuild --platform android --no-install || exit 1
          cd android
          run ./gradlew assembleRelease --no-daemon || exit 1
          ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: travel-adda-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
