name: typecheck-report
# TEMPORARY helper while moving the last files to TypeScript (step 8): on a push to a work branch, runs the type check and
# publishes the full error list (no secrets) to the ci-tsc branch as tsc.txt. Removed again before merging to main.
on:
  push:
    branches-ignore: [main, 'ci-*']
permissions: { contents: write }
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: type check
        run: |
          npm install --legacy-peer-deps >/dev/null 2>&1
          npx tsc -p . --pretty false > /tmp/tsc.txt 2>&1; echo "exit=$?" >> /tmp/tsc.txt
          echo "::notice title=tsc::$(grep -c 'error TS' /tmp/tsc.txt) errors"
      - name: publish
        if: always()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-tsc && git rm -rfq . && cp /tmp/tsc.txt tsc.txt
          git add tsc.txt && git commit -qm "tsc ${GITHUB_SHA}" && git push -f origin ci-tsc
