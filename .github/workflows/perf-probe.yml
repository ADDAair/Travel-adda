name: perf-probe
# Times the app's common server calls on the TEST server (read-only, test accounts; they exist only there). Results as a notice.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: use the test server, never the real one (CI test accounts live only there)
        run: |
          node tools/use_test_server.mjs
          grep -q yhavfnaljbiefzofcduj src/config.ts || exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: time server calls
        env: { CI_TEST_SECRET: '${{ secrets.CI_TEST_SECRET }}' }
        run: |
          . tests/ci_pw.sh
          npm install --no-save --legacy-peer-deps @supabase/supabase-js@2 >/dev/null 2>&1
          node tests/perf_probe.mjs
